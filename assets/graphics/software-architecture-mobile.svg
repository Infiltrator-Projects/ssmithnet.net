<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 600" role="img" aria-labelledby="title desc">
<title id="title">Infiltrator software components, mobile layout</title>
<desc id="desc">Libraries defines the shared contract, filesystem engines own their formats, Boot and Files consume the engines, and InfiltratorOS integrates the system.</desc>
<rect width="390" height="600" fill="#0b151b"/>
<g font-family="Arial,Helvetica,sans-serif">
<text x="22" y="36" fill="#27dce9" font-size="15" font-weight="bold" letter-spacing="1.6">INFILTRATOR SOFTWARE</text>
<text x="22" y="68" fill="#f4f7f8" font-size="24" font-weight="bold">Shared contracts.</text>
<text x="22" y="95" fill="#f4f7f8" font-size="24" font-weight="bold">Separate responsibilities.</text>
<rect x="22" y="121" width="346" height="78" rx="9" fill="#17303a" stroke="#527381" stroke-width="2"/>
<text x="39" y="150" fill="#f5f8f9" font-size="22" font-weight="bold">Libraries / Common V2</text>
<text x="39" y="180" fill="#c4d4db" font-size="18">Shared interfaces</text>
<path d="M195 199 V221" stroke="#27dce9" stroke-width="3"/><path d="M188 214 L195 224 L202 214" fill="none" stroke="#27dce9" stroke-width="3"/>
<rect x="22" y="227" width="346" height="80" rx="9" fill="#12353c" stroke="#27dce9" stroke-width="2"/>
<text x="39" y="257" fill="#f5f8f9" font-size="22" font-weight="bold">Filesystem engines</text>
<text x="39" y="287" fill="#c4d4db" font-size="18">On-disk rules and access</text>
<path d="M195 307 V329" stroke="#27dce9" stroke-width="3"/><path d="M188 322 L195 332 L202 322" fill="none" stroke="#27dce9" stroke-width="3"/>
<rect x="22" y="336" width="165" height="87" rx="9" fill="#17303a" stroke="#527381" stroke-width="2"/>
<text x="37" y="370" fill="#f5f8f9" font-size="22" font-weight="bold">Boot</text>
<text x="37" y="394" fill="#c4d4db" font-size="15">Firmware stage</text>
<rect x="203" y="336" width="165" height="87" rx="9" fill="#17303a" stroke="#527381" stroke-width="2"/>
<text x="218" y="370" fill="#f5f8f9" font-size="22" font-weight="bold">Files</text>
<text x="218" y="394" fill="#c4d4db" font-size="15">OS file operations</text>
<path d="M106 423 V450 H195 M285 423 V450 H195 M195 450 V468" fill="none" stroke="#527381" stroke-width="3"/>
<path d="M188 460 L195 470 L202 460" fill="none" stroke="#527381" stroke-width="3"/>
<rect x="22" y="476" width="346" height="88" rx="9" fill="#1c2830" stroke="#527381" stroke-width="2"/>
<text x="39" y="511" fill="#f5f8f9" font-size="22" font-weight="bold">InfiltratorOS</text>
<text x="39" y="541" fill="#c4d4db" font-size="18">Coordinates components</text>
<text x="22" y="586" fill="#9caeb8" font-size="13">Kernel development is separately qualified.</text>
</g></svg>