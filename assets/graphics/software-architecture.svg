<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 580" role="img" aria-labelledby="title desc">
<title id="title">Infiltrator software component responsibilities</title>
<desc id="desc">Libraries supplies shared contracts to filesystem engines. Boot and Files use the engines in different environments. InfiltratorOS coordinates the overall system.</desc>
<rect width="680" height="580" fill="#0b151b"/>
<g font-family="MB Corpo S">
<text x="38" y="48" fill="#28dce9" font-size="17" font-weight="bold" letter-spacing="2">INFILTRATOR SOFTWARE</text>
<text x="38" y="87" fill="#f1f6f8" font-size="30" font-weight="bold">Clear boundaries, shared interfaces.</text>
<rect x="38" y="119" width="604" height="83" rx="10" fill="#17303a" stroke="#527381" stroke-width="2"/>
<text x="61" y="153" fill="#f5f8f9" font-size="25" font-weight="bold">Libraries / Common V2</text>
<text x="61" y="181" fill="#c4d4db" font-size="19">Contracts shared across components</text>
<path d="M340 202 V236" stroke="#27dce9" stroke-width="3"/><path d="M331 228 L340 240 L349 228" fill="none" stroke="#27dce9" stroke-width="3" stroke-linejoin="round"/>
<rect x="38" y="242" width="604" height="92" rx="10" fill="#12353c" stroke="#27dce9" stroke-width="2"/>
<text x="61" y="278" fill="#f5f8f9" font-size="26" font-weight="bold">Filesystem engines</text>
<text x="61" y="309" fill="#c4d4db" font-size="19">Each format owns its storage behaviour</text>
<path d="M178 334 V370 M499 334 V370" stroke="#27dce9" stroke-width="3"/>
<path d="M169 362 L178 374 L187 362 M490 362 L499 374 L508 362" fill="none" stroke="#27dce9" stroke-width="3" stroke-linejoin="round"/>
<rect x="38" y="378" width="288" height="97" rx="10" fill="#17303a" stroke="#527381" stroke-width="2"/>
<text x="59" y="414" fill="#f5f8f9" font-size="25" font-weight="bold">Boot</text>
<text x="59" y="445" fill="#c4d4db" font-size="18">Firmware-stage filesystem use</text>
<rect x="354" y="378" width="288" height="97" rx="10" fill="#17303a" stroke="#527381" stroke-width="2"/>
<text x="377" y="414" fill="#f5f8f9" font-size="25" font-weight="bold">Files</text>
<text x="377" y="445" fill="#c4d4db" font-size="18">File operations in the OS</text>
<rect x="38" y="499" width="604" height="58" rx="10" fill="#1c2830" stroke="#527381" stroke-width="2"/>
<text x="59" y="522" fill="#f5f8f9" font-size="22" font-weight="bold">InfiltratorOS</text>
<text x="245" y="522" fill="#c4d4db" font-size="18">Integrates the components</text>
<text x="59" y="545" fill="#9caeb8" font-size="15">Kernel development follows its own qualification path</text>
</g></svg>