<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Site-wide responsive review</title>
  <link rel="stylesheet" href="../assets/site.css?v=family-20261016-refined">
  <style>
    body{padding:18px;margin:0;background:#080f15;color:#ecf5f8}
    .review-controls{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:15px}
    label{display:flex;gap:8px;align-items:center}
    select{font:16px system-ui,sans-serif;background:#1b2b34;color:inherit;border:1px solid #65818e;border-radius:4px;padding:9px}
    #result{font:14px system-ui,sans-serif;min-width:200px}
    .frame-scroll{overflow:auto;width:100%;padding:0 0 10px}
    iframe{display:block;width:390px;height:820px;max-width:none;box-sizing:border-box;border:1px solid #65818e;background:#070e13}
  </style>
</head>
<body>
  <div class="review-controls">
    <label for="page">Page
      <select id="page">
        <option value="../index.html">Home</option>
        <option value="../workbench.html">Workbench</option>
        <option value="../projects.html">Projects</option>
        <option value="../garage.html">Garage</option>
        <option value="../about.html">About</option>
        <option value="../archive.html">Archive</option>
        <option value="../downloads/model-11-sandy/index.html">Download</option>
      </select>
    </label>
    <label for="width">Viewport
      <select id="width">
        <option value="320">320 px</option>
        <option value="375">375 px</option>
        <option value="390" selected>390 px</option>
        <option value="430">430 px</option>
        <option value="768">768 px</option>
        <option value="1280">1280 px</option>
      </select>
    </label>
    <output id="result" aria-live="polite">Measuring page…</output>
  </div>
  <div class="frame-scroll">
    <iframe id="preview" title="Actual generated website at selected CSS viewport width" src="../index.html?review=1"></iframe>
  </div>
  <script>
    const page = document.getElementById('page');
    const width = document.getElementById('width');
    const preview = document.getElementById('preview');
    const result = document.getElementById('result');
    function measure() {
      try {
        const doc = preview.contentDocument;
        if (!doc) return;
        const viewport = preview.clientWidth;
        const content = Math.max(doc.documentElement.scrollWidth, doc.body.scrollWidth);
        result.textContent = content > viewport + 1
          ? 'Horizontal overflow: ' + (content - viewport) + ' px'
          : 'No horizontal overflow · ' + viewport + ' px';
      } catch (_) {
        result.textContent = 'Viewport loaded (overflow measurement unavailable)';
      }
    }
    page.addEventListener('change', () => {
      result.textContent = 'Measuring page…';
      preview.src = page.value + '?review=' + Date.now();
    });
    width.addEventListener('change', () => {
      result.textContent = 'Measuring page…';
      preview.style.width = width.value + 'px';
      requestAnimationFrame(measure);
    });
    preview.addEventListener('load', measure);
  </script>
</body>
</html>
