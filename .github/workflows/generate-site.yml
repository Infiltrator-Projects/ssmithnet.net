name: Build and deploy site

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'CNAME'
      - 'Makefile'
      - 'DESIGN.md'
      - 'README.md'
      - 'assets/**'
      - '.github/workflows/generate-site.yml'
  workflow_dispatch:

# GitHub Pages is published from the generated Actions artifact, not from main.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout pinned Infiltratr Common 1.18.1
        uses: actions/checkout@v4
        with:
          repository: Infiltrator-Projects/Infiltrator-Libraries
          ref: dcfa6fee9e9263a0dce5c137054d4adf130c2f25
          path: _common

      - name: Verify committed COMMON web snapshot
        run: cmp assets/infiltrator-web-v1.css _common/design/infiltrator-web-v1.css

      - name: Build C++17 generator with COMMON
        run: make COMMON_DIR="$GITHUB_WORKSPACE/_common" sitegen

      - name: Validate generator, COMMON snapshot and site structure
        run: make COMMON_DIR="$GITHUB_WORKSPACE/_common" check

      - name: Build Pages artifact
        run: |
          rm -rf public
          mkdir -p public
          ./build/sitegen public
          cp -a assets public/assets
          cp CNAME public/CNAME
          touch public/.nojekyll
          test -s public/index.html
          test -s public/workbench.html
          test -s public/garage.html
          test -s public/archive.html
          test -s public/assets/site.css
          test -s public/assets/site-overrides.css

      - name: Deploy Pages through pinned COMMON
        id: deployment
        uses: Infiltrator-Projects/Infiltrator-Libraries/.github/actions/deploy-pages@dcfa6fee9e9263a0dce5c137054d4adf130c2f25
        with:
          path: public
          artifact-name: github-pages-${{ github.run_attempt }}
