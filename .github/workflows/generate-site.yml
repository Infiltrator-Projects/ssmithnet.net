name: Build site

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'Makefile'
      - 'DESIGN.md'
      - 'README.md'
      - 'assets/**'
      - '.github/workflows/generate-site.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build generator
        run: make sitegen

      - name: Generate site
        run: ./build/sitegen .

      - name: Verify generated pages
        run: |
          test -s index.html
          test -s workbench.html
          test -s garage.html
          test -s archive.html
          grep -q 'E 250 CDI BlueEFFICIENCY Coupé' garage.html
          grep -q 'LINK family' index.html
          test "$(grep -o 'site-overrides.css' index.html | wc -l)" -eq 1

      - name: Publish generated pages to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html workbench.html garage.html archive.html
          if git diff --cached --quiet; then
            echo 'No generated changes.'
          else
            git commit -m 'Generate site from C++ source'
            git push
          fi
