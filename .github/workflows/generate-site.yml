name: Build and deploy site

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'CNAME'
      - 'Makefile'
      - 'DESIGN.md'
      - 'README.md'
      - 'assets/**'
      - '.github/workflows/generate-site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build C++17 generator
        run: make sitegen

      - name: Validate generator and site structure
        run: make check

      - name: Build Pages artifact
        run: |
          rm -rf public
          mkdir -p public
          ./build/sitegen public
          cp -a assets public/assets
          cp CNAME public/CNAME
          touch public/.nojekyll
          test -s public/index.html
          test -s public/workbench.html
          test -s public/garage.html
          test -s public/archive.html
          test -s public/assets/site.css
          test -s public/assets/site-overrides.css

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
