name: Build site

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - '*.html'
      - 'Makefile'
      - 'DESIGN.md'
      - 'README.md'
      - 'assets/**'
      - '.github/workflows/generate-site.yml'
  workflow_dispatch:

concurrency:
  group: site-generation-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build generator
        run: make sitegen

      - name: Generate site
        run: ./build/sitegen .

      - name: Verify generated pages
        run: make check

      - name: Publish generated pages to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html workbench.html garage.html archive.html
          if git diff --cached --quiet; then
            echo 'No generated changes.'
          else
            git commit -m 'Generate site from C++ source'
            git push
          fi

