<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Responsive layout review</title><link rel="stylesheet" href="assets/site.css?v=family-20261016-refined"><style>body{padding:16px}nav{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}button,select{font:16px var(--sans);background:var(--bg2);color:var(--text);border:1px solid var(--line);padding:8px 12px}iframe{display:block;width:390px;height:800px;max-width:none;border:1px solid var(--line);box-sizing:content-box}</style></head><body><nav aria-label="Layout review"><label>Page <select id="page"><option value="index.html">Home</option><option value="workbench.html">Workbench</option><option value="garage.html">Garage</option><option value="about.html">About</option></select></label><label>Width <select id="width"><option value="390">390</option><option value="768">768</option><option value="1280">1280</option><option value="320">320</option></select></label></nav><iframe title="Responsive website preview" id="preview" src="index.html"></iframe><script>document.getElementById('page').addEventListener('change',function(){document.getElementById('preview').src=this.value});document.getElementById('width').addEventListener('change',function(){document.getElementById('preview').style.width=this.value+'px'})</script></body></html>
